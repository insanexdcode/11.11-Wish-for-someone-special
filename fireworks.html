
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Hooria ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #0b0712;
    font-family: 'Raleway', sans-serif;
    color: white;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.message {
    position: fixed;
    z-index: 3;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 750px;
    text-align: center;
    pointer-events: none;
    animation: appear 2s ease;
}

.small {
    color: #e3c9e8;
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: .4em;
    margin-bottom: 24px;
}

h1 {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(35px, 7vw, 65px);
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-shadow: 0 0 20px rgba(255, 190, 220, .35);
}

.heart {
    display: block;
    color: #f5b9d5;
    font-size: 35px;
    margin-top: 20px;
    font-weight: 200;
    animation: pulse 2s infinite;
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes pulse {
    50% { transform: scale(1.2); }
}

@media(max-width: 500px) {
    h1 { font-size: 36px; }
    .small { font-size: 9px; }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="message">
    <div class="small"> Miss Hooria kayani</div>
    <h1> My forever 11.11 wish</h1>
    <span class="heart">♡</span>
</div>

<!-- SAME SONG, RESTARTING FROM ZERO -->
<audio id="mySong" src="./music.mp3" loop></audio>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W, H;
let bursts = [];

const colours = [
    "#ffaaa8",
    "#ffb8ca",
    "#e9a4bb",
    "#f7c4d7",
    "#ffd9bd",
    "#e8b5ff",
    "#fff0e8"
];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);

function createBurst() {
    const x = W * (0.08 + Math.random() * 0.84);
    const y = H * (0.08 + Math.random() * 0.55);

    const colour = colours[
        Math.floor(Math.random() * colours.length)
    ];

    const rays = [];
    const numberOfRays = 35 + Math.floor(Math.random() * 20);

    for (let i = 0; i < numberOfRays; i++) {
        const angle = (Math.PI * 2 * i / numberOfRays)
            + (Math.random() - 0.5) * 0.1;

        rays.push({
            angle: angle,
            length: 65 + Math.random() * 95,
            delay: Math.random() * 0.12,
            size: 1.5 + Math.random() * 1.5
        });
    }

    bursts.push({
        x: x,
        y: y,
        colour: colour,
        rays: rays,
        age: 0,
        duration: 2.8
    });
}

function drawBurst(burst, delta) {
    burst.age += delta;

    const fade = Math.max(
        0,
        1 - Math.max(0, burst.age - 1.1) / 1.7
    );

    burst.rays.forEach(ray => {
        const rayProgress = Math.max(
            0,
            Math.min(1, (burst.age - ray.delay) / 0.65)
        );

        if (rayProgress <= 0) return;

        const distance = ray.length * rayProgress;
        const startDistance = Math.max(0, distance - 42);

        const startX = burst.x + Math.cos(ray.angle) * startDistance;
        const startY = burst.y + Math.sin(ray.angle) * startDistance;

        const endX = burst.x + Math.cos(ray.angle) * distance;
        const endY = burst.y + Math.sin(ray.angle) * distance;

        ctx.globalAlpha = fade;

        ctx.beginPath();
        ctx.setLineDash([2, 5]);
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);

        ctx.strokeStyle = burst.colour;
        ctx.lineWidth = ray.size;
        ctx.lineCap = "round";
        ctx.shadowBlur = 12;
        ctx.shadowColor = burst.colour;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(endX, endY, ray.size + 1, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd5d2";
        ctx.shadowBlur = 18;
        ctx.shadowColor = burst.colour;
        ctx.fill();
    });

    ctx.globalAlpha = fade;
    ctx.beginPath();
    ctx.arc(burst.x, burst.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#fff1ed";
    ctx.shadowBlur = 20;
    ctx.shadowColor = burst.colour;
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

let lastTime = 0;

function animate(time) {
    requestAnimationFrame(animate);

    const delta = Math.min((time - lastTime) / 1000 || 0, 0.05);
    lastTime = time;

    ctx.fillStyle = "rgba(11, 7, 18, 0.16)";
    ctx.fillRect(0, 0, W, H);

    for (let i = bursts.length - 1; i >= 0; i--) {
        drawBurst(bursts[i], delta);

        if (bursts[i].age >= bursts[i].duration) {
            bursts.splice(i, 1);
        }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
}

requestAnimationFrame(animate);

// FIREWORKS
createBurst();
setTimeout(createBurst, 300);
setTimeout(createBurst, 650);
setTimeout(createBurst, 1000);

setInterval(createBurst, 650);

// PAGE 3 MUSIC: ALWAYS START FROM THE BEGINNING
const song = document.getElementById("mySong");
song.volume = 0.6;

async function startMusic() {
    song.currentTime = 0;

    try {
        await song.play();
    } catch (error) {
        // Browser may require one tap to allow playback.
    }
}

window.addEventListener("load", startMusic);

document.addEventListener("pointerdown", () => {
    if (song.paused) {
        startMusic();
    }
}, { once: true });

</script>

</body>
</html>
